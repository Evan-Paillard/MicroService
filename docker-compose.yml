services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: polytech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  mi8:
    build:
      context: .
      dockerfile: mi8/Dockerfile
    ports:
      - "50051:50051"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  erasmumu:
    build:
      context: .
      dockerfile: erasmumu/Dockerfile
    ports:
      - "3002:3002"
    environment:
      MONGO_URL: mongodb://mongodb:27017/erasmumu
    depends_on:
      mongodb:
        condition: service_healthy

  polytech:
    build:
      context: .
      dockerfile: polytech/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/polytech
      ERASMUMU_URL: http://erasmumu:3002
      MI8_ADDRESS: mi8:50051
    depends_on:
      postgres:
        condition: service_healthy
      erasmumu:
        condition: service_started
      mi8:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - polytech

  colporteur:
    build:
      context: .
      dockerfile: colporteur/Dockerfile
    environment:
      MI8_ADDRESS: mi8:50051
    depends_on:
      mi8:
        condition: service_started
    restart: "no"
