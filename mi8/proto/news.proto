syntax = "proto3";

package mi8;

service NewsService {
  rpc GetLatestNews(GetLatestNewsRequest) returns (NewsListResponse);
  rpc GetLatestNewsInCity(GetLatestNewsInCityRequest) returns (NewsListResponse);
  rpc CreateNews(CreateNewsRequest) returns (NewsResponse);
  rpc GetCityScore(GetCityScoreRequest) returns (CityScoreResponse);
  rpc GetTopCities(GetTopCitiesRequest) returns (CityScoreListResponse);
  rpc GetCityStats(GetCityStatsRequest) returns (CityStatsResponse);
}

message News {
  string id = 1;
  string name = 2;
  string source = 3;
  string date = 4;
  repeated string tags = 5;
  string city = 6;
  string country = 7;
}

message GetLatestNewsRequest {
  int32 limit = 1;
}

message GetLatestNewsInCityRequest {
  string city = 1;
  int32 limit = 2;
}

message CreateNewsRequest {
  string name = 1;
  string source = 2;
  string date = 3;
  repeated string tags = 4;
  string city = 5;
  string country = 6;
}

message NewsResponse {
  News news = 1;
}

message NewsListResponse {
  repeated News news = 1;
}

message CityScore {
  string city = 1;
  string country = 2;
  int32 quality_of_life = 3;
  int32 safety = 4;
  int32 economy = 5;
  int32 culture = 6;
  string last_updated = 7;
}

message GetCityScoreRequest {
  string city = 1;
}

message CityScoreResponse {
  CityScore city_score = 1;
}

message GetTopCitiesRequest {
  int32 limit = 1;
}

message CityScoreListResponse {
  repeated CityScore cities = 1;
}

message CityStats {
  string city = 1;
  int32 total_offers = 2;
  map<string, int32> offers_by_domain = 3;
  string last_offer_date = 4;
}

message GetCityStatsRequest {
  string city = 1;
}

message CityStatsResponse {
  CityStats city_stats = 1;
}
